name: NordHomes
version: '${project.version}'
main: com.nordfjell.nordhomes.NordHomesPlugin
api-version: '26.2'
folia-supported: true
author: Nord Fjell
description: Lightweight single-home and last-death return for Nord Fjell.

commands:
  sethome:
    description: Save or overwrite your home.
    usage: /sethome
    permission: nordhomes.sethome
  home:
    description: Teleport to your home after the configured countdown.
    usage: /home
    permission: nordhomes.home
  back:
    description: Return to your most recent death location after the configured countdown.
    usage: /back
    permission: nordhomes.back

permissions:
  nordhomes.sethome:
    default: true
  nordhomes.home:
    default: true
  nordhomes.back:
    default: true
